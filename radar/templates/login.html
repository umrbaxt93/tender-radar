<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — Tender Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white font-black text-xl shadow-lg shadow-indigo-500/30">
        TR
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">Tender Radar</h1>
      <p class="text-xs text-slate-400">Davlat xaridlari tahliliy razvedka tizimi</p>
    </div>

    {% if error %}
    <div class="bg-rose-950/80 border border-rose-800 text-rose-300 text-xs px-4 py-3 rounded-xl flex items-center gap-2">
      <span>⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url or '/radar' }}">

      <div class="space-y-1">
        <label for="username" class="block text-xs font-semibold text-slate-300">Foydalanuvchi nomi</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
               placeholder="username">
      </div>

      <div class="space-y-1">
        <label for="password" class="block text-xs font-semibold text-slate-300">Parol</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
               placeholder="••••••••">
      </div>

      <button type="submit"
              class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-150 ease-in-out mt-2">
        Tizimga kirish
      </button>
    </form>

    <div class="pt-4 border-t border-slate-700/60 text-center">
      <p class="text-[11px] text-slate-500">Softy LLC © 2026 • Ichki xavfsiz tizim</p>
    </div>
  </div>
</body>
</html>
