    - bir dona narxi
    - narxi
    - цена за единицу
    - цена
    - unit price
    - price
  currency:
    - valyuta
    - валюта
    - currency
  lot_number:
    - lot raqami
    - lot nomeri
    - номер лота
    - лот
    - lot
  region:
    - viloyat
    - hudud
    - область
    - регион
    - region
  procedure_type:
    - xarid turi
    - shartnoma turi
    - savdo turi
    - вид закупки
    - тип договора
    - turi
