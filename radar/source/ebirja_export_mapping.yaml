# Column mapping for an E-Birja cabinet export file (.xlsx / .csv).
#
# UNVERIFIED. No real export file was available when this was written, and CLAUDE.md forbids
# logging in to ebirja.uz to fetch one, so every synonym below is a candidate wording rather
# than an observed header. The importer is built around that: run
#
#     radar import-ebirja-export --inspect <file>
#
# against a real export and it prints the file's own headers, what each target field matched,
# and what it could not match. Add the real wording to the list below -- no code change.
#
# Matching is case-insensitive and punctuation-insensitive, and prefers the longest synonym,
# so "buyurtmachi inn" claims the STIR column before "buyurtmachi" claims it as a name.
# `required` fields decide whether a row can be used at all.

required:
  - contract_number
  - product_name

columns:
  contract_number:
    - shartnoma raqami
    - shartnoma nomeri
    - shartnoma raqam
    - shartnoma
    - nomer dogovora
    - номер договора
    - договор
    - contract number
    - contract no
  contract_date:
    - shartnoma sanasi
    - shartnoma tuzilgan sana
    - tuzilgan sana
    - дата договора
    - дата заключения
    - contract date
    - sana
    - дата
  customer_name:
    - buyurtmachi nomi
    - buyurtmachi
    - xaridor nomi
    - xaridor
    - заказчик
    - покупатель
    - customer
    - buyer
  customer_stir:
