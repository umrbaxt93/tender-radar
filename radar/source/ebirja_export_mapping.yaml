    - yetkazib beruvchi
    - taminotchi
    - ta'minotchi
    - sotuvchi nomi
    - sotuvchi
    - поставщик
    - продавец
    - supplier
    - winner
  supplier_stir:
    - yetkazib beruvchi stir
    - yetkazib beruvchi inn
    - sotuvchi inn
    - sotuvchi stir
    - инн поставщика
    - инн продавца
    - supplier tin
  amount:
    - shartnoma summasi
    - umumiy summa
    - jami summa
    - summa
    - сумма договора
    - общая сумма
    - сумма
    - total
    - amount
  product_name:
    - mahsulot nomi
    - tovar nomi
    - mahsulot
    - tovar
    - xizmat nomi
    - nomlanishi
    - наименование товара
    - наименование
    - товар
    - product name
    - product
  quantity:
    - miqdori
    - miqdor
    - soni
    - количество
    - quantity
  unit:
    - olchov birligi
    - o'lchov birligi
    - birligi
