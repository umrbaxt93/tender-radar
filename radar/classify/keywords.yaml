# Term detection: "12 oy", "1 yil", "1 год", "36 months".
term_patterns:
  - "re:(\\d{1,3})[\\s-]*(?:oy|ой|month|месяц)"
  - "re:(\\d{1,2})[\\s-]*(?:yil|йил|год|года|лет|year)"

# Brand extraction. Key is the canonical brand, values are aliases.
brands:
  Microsoft: [microsoft, майкрософт, windows, office 365, m365]
  Kaspersky: [kaspersky, касперский]
  Fortinet: [fortinet, fortigate, "re:\\bfg-?\\d{2,4}[a-z]?\\b"]
  Cisco: [cisco, catalyst]
  HPE: [hpe, hewlett, proliant]
  Dell: [dell, poweredge, powervault, latitude]
  Lenovo: [lenovo, thinkpad, thinkcentre]
  Zoom: [zoom]
  Google: [google workspace, g suite]
  Hikvision: [hikvision]
  Dahua: [dahua]
  APC: [apc, smart-ups]
  "Dr.Web": [dr.web, drweb]
