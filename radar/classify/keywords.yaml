# Keyword pre-filter over title + lot item names.
# Languages: Uzbek-Latin, Uzbek-Cyrillic, Russian, English.
# Matching is case-insensitive on a normalized string; entries are plain substrings
# unless they start with "re:", which marks a regular expression.
#
# A category's keywords decide both "is this IT" and which category is proposed.
# Anything matching not_it without an it hit is classified by rule as non-IT and is
# NEVER sent to the AI, which is the main cost control.

categories:
  Server:
    - server
    - сервер
    - serverlar
    - proliant
    - poweredge
    - "re:\\bdl\\d{2,3}\\b"
    - blade
    - rack server
