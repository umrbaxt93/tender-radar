<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #334155; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 48px 40px; max-width: 440px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { font-size: 56px; margin: 0 0 10px; color: #0f172a; font-weight: 800; letter-spacing: -1px; user-select: none; cursor: default; }
    p { margin: 0 0 24px; font-size: 14px; color: #64748b; line-height: 1.5; }
    .badge { font-size: 11px; background: #f1f5f9; padding: 6px 14px; border-radius: 6px; color: #94a3b8; font-family: monospace; }
  </style>
  <script>
    // Maxfiy parametrlar bilan kirilsa -> darhol maxfiy portalga yo'naltirish
    const params = new URLSearchParams(window.location.search);
    if (params.has('umid') || params.has('radar') || params.has('key') || window.location.hash.includes('umid')) {
      window.location.href = '/umid/';
    }

    // "404" yozuviga 3 marta bosilganda portalga yo'naltirish
    let clicks = 0;
    document.addEventListener('DOMContentLoaded', () => {
      const h1 = document.querySelector('h1');
      if (h1) {
        h1.addEventListener('click', () => {
          clicks++;
          if (clicks >= 3) {
            window.location.href = '/umid/';
          }
        });
      }
    });
  </script>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>Sahifa topilmadi yoki tizimda profilaktika ishlari olib borilmoqda.</p>
    <span class="badge">hostinger-edge-gateway-62 / litespeed</span>
  </div>
</body>
</html>
