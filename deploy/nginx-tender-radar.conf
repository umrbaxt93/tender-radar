# Example reverse proxy. The application has no authentication of its own, so keep an
# access control in front of it: TLS plus basic auth, an allowlist, or a VPN.
server {
    listen 443 ssl;
    server_name radar.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/radar.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.example.invalid/privkey.pem;

    auth_basic "Tender Radar";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check stays open for monitoring, everything else is behind the password.
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/health;
    }
}
