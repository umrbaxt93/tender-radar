# ─────────────────────────────────────────────────────────────────────
# Softy LLC — Nginx Reverse Proxy Configuration for tender.softy.uz
#
# Ishga tushirish qadamlari (Serverda):
# 1. Ushbu faylni /etc/nginx/sites-available/tender.softy.uz ga nusxalash:
#      sudo cp tender.softy.uz.conf /etc/nginx/sites-available/tender.softy.uz
# 2. Saytni faollashtirish (symlink):
#      sudo ln -s /etc/nginx/sites-available/tender.softy.uz /etc/nginx/sites-enabled/
# 3. SSL sertifikatini o'rnatish (Let's Encrypt):
#      sudo certbot --nginx -d tender.softy.uz
# 4. Nginx konfiguratsiyasini qayta yuklash:
#      sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────

upstream softy_procurement_app {
    server 127.0.0.1:8080 fail_timeout=5s;
    keepalive 32;
}

# 1. Plain HTTP (Port 80) — Redirect to HTTPS or direct proxy
server {
    listen 80;
    listen [::]:80;
    server_name tender.softy.uz;

    # Certbot SSL o'rnatilgandan so'ng avtomatik HTTPS ga yo'naltiradi:
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    # Gzip siqish
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Asosiy ilovaga yo'naltirish
    location / {
        proxy_pass http://softy_procurement_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Statik fayllarni keshlashtirish (CSS, JS, Fontlar)
    location ~* \.(?:css|js|woff2?|svg|png|ico|jpg)$ {
        proxy_pass http://softy_procurement_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# 2. HTTPS (Port 443) — Certbot faollashganda ishlaydi
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tender.softy.uz;

    # SSL Sertifikat yo'llari (Certbot o'rnatganda to'ldiriladi):
    # ssl_certificate     /etc/letsencrypt/live/tender.softy.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tender.softy.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Xavfsizlik sarlavhalari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://softy_procurement_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
